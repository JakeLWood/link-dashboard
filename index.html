<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links dashboard</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f5f5f4;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #d4d4d4;
    background: #fff;
    border-radius: 8px;
    cursor: pointer;
  }
  .tab-btn[aria-selected="true"] {
    background: #ececea;
    border-color: #b5b5b0;
  }
  .panel {
    background: #fff;
    border: 1px solid #e0e0dc;
    border-radius: 12px;
    padding: 20px;
  }
  .panel p {
    font-size: 14px;
    color: #555;
    margin: 0 0 16px;
  }
  .panel a.link-btn {
    display: inline-block;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid #b5b5b0;
    text-decoration: none;
    color: #1a1a1a;
    font-size: 14px;
  }
  .panel a.link-btn:hover {
    background: #f0f0ee;
  }
</style>
</head>
<body>
<div class="app">
  <div class="tabs" role="tablist">
    <button class="tab-btn" id="tab-btn-claude" role="tab" aria-selected="true" onclick="showTab('claude')">Claude</button>
    <button class="tab-btn" id="tab-btn-google" role="tab" aria-selected="false" onclick="showTab('google')">Google search</button>
  </div>

  <div class="panel" id="panel-claude">
    <p>Anthropic's AI assistant for chat, writing, coding, and research.</p>
    <a class="link-btn" href="https://claude.ai" target="_blank" rel="noopener">Open Claude &#8599;</a>
  </div>

  <div class="panel" id="panel-google" style="display:none;">
    <p>Search the web for anything using Google.</p>
    <a class="link-btn" href="https://www.google.com" target="_blank" rel="noopener">Open Google search &#8599;</a>
  </div>
</div>

<script>
function showTab(which) {
  const isClaude = which === 'claude';
  document.getElementById('panel-claude').style.display = isClaude ? '' : 'none';
  document.getElementById('panel-google').style.display = isClaude ? 'none' : '';
  document.getElementById('tab-btn-claude').setAttribute('aria-selected', isClaude ? 'true' : 'false');
  document.getElementById('tab-btn-google').setAttribute('aria-selected', isClaude ? 'false' : 'true');
}
</script>
</body>
</html>
